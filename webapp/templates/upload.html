<!DOCTYPE html>
<html>
<head>
    <title>SecureBank — Upload</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .navbar {
            background: #16213e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00d4ff;
            margin-bottom: 30px;
        }
        .navbar h1 {
            color: #00d4ff;
            margin: 0;
        }
        .navbar a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
        }
        .navbar a:hover {
            color: #00d4ff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .card h2 {
            color: #00d4ff;
            margin-top: 0;
        }
        .upload-area {
            border: 2px dashed #00d4ff;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            color: #aaa;
        }
        input[type="file"] {
            margin: 10px 0;
            color: white;
        }
        button {
            padding: 12px 24px;
            background: #00d4ff;
            border: none;
            border-radius: 4px;
            color: #1a1a2e;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0099bb;
        }
        .success {
            background: #00aa55;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
        .note {
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏦 SecureBank</h1>
        <div>
            <a href="/profile?id=1">Profile</a>
            <a href="/search">Search</a>
            <a href="/logout">Logout</a>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <h2>Upload Document</h2>
            {% if message %}
                <div class="success">{{ message }}</div>
            {% endif %}
            <form method="POST" enctype="multipart/form-data">
                <div class="upload-area">
                    <p>Upload your bank statement or profile picture</p>
                    <input type="file" name="file">
                </div>
                <button type="submit">Upload File</button>
            </form>
            <p class="note">Accepted formats: JPG, PNG, PDF</p>
        </div>
    </div>
</body>
</html>
